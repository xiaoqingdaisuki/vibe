services:
  web:
    image: vibe:latest
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost}
    restart: unless-stopped
    init: true
    ports:
      - '${APP_PORT:-80}:3000'
    environment:
      AGENT_API_BASE_URL: ${AGENT_API_BASE_URL:-https://agent-production-49c1.up.railway.app}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
